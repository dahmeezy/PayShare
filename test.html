<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayShare UI Foundation</title>
  <link rel="stylesheet" href="frontend/ui/index.css">
</head>
<body>
  <div class="container max-w-1440 mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4">PayShare UI Foundation</h1>
    
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Brand Navy</div>
        <div class="h-12 w-24 bg-brand-deep-navy"></div>
      </div>
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Brand Teal</div>
        <div class="h-12 w-24 bg-brand-teal"></div>
      </div>
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Surface White</div>
        <div class="h-12 w-24 bg-surface-white"></div>
      </div>
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Neutral Light</div>
        <div class="h-12 w-24 bg-neutral-light"></div>
      </div>
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Neutral Medium</div>
        <div class="h-12 w-24 bg-neutral-medium"></div>
      </div>
      <div class="p-3 border rounded-md">
        <div class="text-primary font-semibold">Neutral Dark</div>
        <div class="h-12 w-24 bg-neutral-dark"></div>
      </div>
    </div>

    <div class="mt-8">
      <h2 class="text-xl font-semibold mb-3">Buttons</h2>
      <button class="btn-primary px-4 py-2 text-white font-medium rounded-md">Primary</button>
      <button class="btn-secondary px-4 py-2 text-gray-700 font-medium rounded-md border border-gray-300 bg-white">Secondary</button>
    </div>
  </div>
</body>
</html>
