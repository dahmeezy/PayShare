name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../frontend/prototype/navigation.test.mjs
  attribution-check:
    name: attribution-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No agent attribution, no outside co-authors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            .github/scripts/check-attribution.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            .github/scripts/check-attribution.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi
