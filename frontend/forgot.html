<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayShare - Reset your password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="prototype/auth-controls.css">
</head>
<body>
  <div class="max-w-1440 mx-auto" style="min-height: 100vh;">
    <!-- Auth layout -->
    <div class="grid lg:grid-cols-12 gap-8 py-8">
      
      <!-- Left navy panel -->
      <div class="lg:col-span-5 bg-[var(--color-brand-deep-navy)] text-[var(--color-neutral-on-dark)] p-8">
        <div class="text-center mb-8">
          <div class="w-16 h-16 mx-auto mb-6 rounded-full flex items-center justify-center" style="background: var(--color-brand-teal);">
            <span class="text-xl font-bold" style="color: var(--color-neutral-white);">PS</span>
          </div>
          <h2 class="text-2xl font-bold mb-2">It happens to everyone.</h2>
          <p class="text-lg">We'll help you back in.</p>
        </div>

        <p class="text-sm text-[rgba(255,255,255,0.6)] mb-6">Enter a sample email or WhatsApp number to try password recovery.</p>


        <p class="text-sm text-[rgba(255,255,255,0.5)] mt-6">© 2026 PayShare - USDC on Stellar</p>
      </div>

      <!-- Right white panel -->
      <div class="lg:col-span-7 bg-[var(--color-neutral-white)] p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4">We'll help you back in.</h2>

        <p class="text-text-secondary mb-4">Use the sample code on the next screen to try a local reset.</p>

        <p class="auth-demo-note">Demo only. Use sample values.</p>
        <form>
          <div>
            <label class="label" for="contact">Email or WhatsApp</label>
            <input type="text" id="contact" data-contact required class="input input-with-icon"
                   placeholder="name@email.com or +1 555-123-4567"
                   aria-label="Email or WhatsApp">
            <span class="input-icon">📧</span>
          </div>

          <button type="submit" class="btn btn-primary w-full mt-4">Get demo code</button>
        </form>
        <p id="auth-feedback" class="auth-feedback" role="alert"></p>

        <p class="text-sm mt-4 text-text-secondary" id="back-link">
          <a href="login.html" style="color: var(--color-brand-teal);">Go to log in</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="prototype/legacy-auth.mjs"></script>
</body>
</html>
